<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Photo Generator - Studio Mobile</title>
    
    <!-- FAVICON DU CLUB (à fournir) -->
    <link rel="icon" type="image/png" href="assets/club_favicon.png" />

    <!-- Google Fonts : Inter pour l'UI, Orbitron pour le Cyberpunk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:ital,wght@0,600;0,800;1,900&display=swap" rel="stylesheet">

    <!-- CSS : DA Modern 3D Claymorphism / Neumorphic Dark UI -->
    <style>
        :root {
            /* Palette Dark Neumorphic */
            --bg-deep: #0c1322;
            --bg-ui: #151d30;
            --text-pure: #ffffff;
            --text-soft: #a0aec0;
            
            /* Accents Claymorphism */
            --gradient-blue: linear-gradient(135deg, #2575fc 0%, #1a54b8 100%);
            --gradient-orange: linear-gradient(135deg, #ff8a44 0%, #e05338 100%);
            --cyan-neon: #00d2ff;

            /* Neumorphic Double Shadows (Soft & Deep) */
            --shadow-clay-card: 
                -4px -4px 10px rgba(255, 255, 255, 0.05),
                inset -1px -1px 2px rgba(255, 255, 255, 0.03),
                8px 8px 16px rgba(0, 0, 0, 0.3);

            --shadow-clay-btn: 
                -3px -3px 8px rgba(255, 255, 255, 0.06),
                4px 4px 10px rgba(0, 0, 0, 0.3);

            /* Claymorphism Pressed / Inset Effect */
            --shadow-clay-pressed:
                inset 3px 3px 6px rgba(0, 0, 0, 0.6),
                inset -2px -2px 5px rgba(255, 255, 255, 0.05);

            --border-radius-card: 24px;
            --border-radius-btn: 18px;
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* === RESET & BASE === */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; font-family: 'Inter', sans-serif; background-color: var(--bg-deep); color: var(--text-pure); overflow: hidden; }

        /* Noise Texture Overlay */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3%3Ffilter id='noiseFilter'%3%3FfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3%3F/filter%3%3F%3Frect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3%3F/svg%3%3F");
            opacity: 0.03; pointer-events: none; z-index: -1;
        }

        /* === UI COMPONENTS === */
        .page-header { width: 100%; text-align: center; padding: 20px 0; flex-shrink: 0; z-index: 10; }
        .logo-placeholder { width: 70px; height: 70px; border-radius: 50%; margin: 0 auto; background: var(--shadow-clay-pressed); }
        .app-title { font-size: 18px; font-weight: 700; margin-top: 10px; color: var(--text-soft); }

        /* Champ de texte Neumorphique (Saisie du prénom) */
        .neumorphic-input {
            width: 100%; max-width: 320px; appearance: none;
            background: var(--bg-deep); border-radius: 20px; padding: 18px 20px;
            box-shadow: var(--shadow-clay-pressed); border: 1px solid rgba(255,255,255,0.02);
            color: var(--cyan-neon); font-family: 'Orbitron', sans-serif; font-size: 18px; 
            font-weight: 700; text-align: center; margin: 10px auto 30px auto; display: block;
            outline: none; transition: box-shadow 0.3s var(--ease-in-out);
            /* Permet de taper au clavier sans que le parent ne soit bloqué par le user-select:none global */
            user-select: auto; -webkit-user-select: auto;
        }
        .neumorphic-input:focus {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.8), inset -2px -2px 5px rgba(255,255,255,0.05), 0 0 15px rgba(0, 210, 255, 0.2);
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .neumorphic-input::placeholder { color: rgba(255,255,255,0.2); font-family: 'Inter', sans-serif; font-weight: 400; }

        /* Le "Magic Container" générique 9:16 pour les photos */
        .photo-frame-container {
            flex: 1; width: 100%; min-height: 0; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        
        .magic-card-9-16 {
            position: relative; width: 100%; height: 100%; aspect-ratio: 9/16;
            border-radius: 12px; background: var(--bg-ui);
            box-shadow: var(--shadow-clay-card);
            overflow: hidden; border: 1px solid rgba(255,255,255,0.03);
            display: flex; justify-content: center; align-items: center;
        }

        #final-render, #touch-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 10;
        }
        #touch-layer { z-index: 20; touch-action: none; }

        .btn-footer {
            width: 100%; display: flex; flex-direction: column; gap: 15px;
            padding: 20px calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-bottom));
            flex-shrink: 0; z-index: 10;
        }

        /* Claymorphism Buttons with 3D Interaction */
        .clay-btn {
            width: 100%; padding: 18px; border: none; font-family: 'Inter', sans-serif;
            font-size: 16px; font-weight: 700; text-transform: uppercase; color: #fff;
            border-radius: var(--border-radius-btn); box-shadow: var(--shadow-clay-btn);
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.15s var(--ease-in-out), box-shadow 0.1s var(--ease-in-out);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .clay-btn::after {
            content: ""; position: absolute; top: -1px; left: 0; width: 100%; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            border-radius: var(--border-radius-btn) var(--border-radius-btn) 0 0;
        }

        .btn-primary { background: var(--gradient-blue); }
        .btn-success { background: var(--gradient-blue); }
        .btn-secondary { background: var(--bg-ui); color: var(--text-soft); }

        .clay-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-clay-btn), 0 5px 15px rgba(37, 117, 252, 0.2); }
        .clay-btn:active { transform: translateY(1px) scale(0.98); box-shadow: var(--shadow-clay-pressed); }

        /* Modern Clay Toggle Switch */
        .toggle-container {
            width: 100%; max-width: 320px; display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-ui); border-radius: 50px; padding: 10px 15px; box-shadow: var(--shadow-clay-pressed);
            margin: 0 auto;
        }
        .toggle-label { font-size: 14px; font-weight: 600; color: var(--text-soft); }
        
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-deep); transition: .4s var(--ease-in-out);
            border-radius: 34px; border: 1px solid rgba(255,255,255,0.03);
            box-shadow: var(--shadow-clay-pressed);
        }
        .slider:before {
            content: ""; position: absolute; height: 26px; width: 26px; left: 4px; bottom: 3px;
            background-color: white; transition: .4s var(--ease-in-out); border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3), inset 0 -3px 3px rgba(0,0,0,0.2);
        }
        input:checked + .slider { background: var(--gradient-blue); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* === PAGES MANAGEMENT === */
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; animation: clayPop 0.3s var(--ease-in-out) forwards; }
        @keyframes clayPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* === PAGE SPECIFICS === */
        #screen-edit, #screen-result { padding: 0; justify-content: flex-start; }
        #screen-edit .magic-card-9-16, #screen-result .magic-card-9-16 { border-radius: 0; border: none; box-shadow: none; border-bottom: 2px solid rgba(255,255,255,0.03); }

        #file-input, #render-canvas { display: none; }
    </style>
</head>
<body>
    
    <div class="preload-font">Orbitron</div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-container" style="height: 100%; width: 100%; position: relative;">
        
        <!-- ======================================================== -->
        <!-- SCREEN 1: ACCUEIL (Saisie Prénom & Thème) -->
        <!-- ======================================================== -->
        <div id="screen-home" class="screen active">
            <header class="page-header">
                <img id="club-logo" src="assets/app_logo.png" class="logo-placeholder" alt="Logo Club">
                <div class="app-title">Studio Mobile - Photo Team</div>
            </header>

            <main style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
                
                <!-- SAISIE LIBRE DU PRÉNOM (Neumorphic Input) -->
                <div style="width: 100%; text-align: center;">
                    <label class="toggle-label" style="display:block; margin-bottom: 15px;">👤 IDENTITÉ DU CHAMPION(NE)</label>
                    <input type="text" id="child-name-input" class="neumorphic-input" placeholder="Prénom ou surnom..." autocomplete="off">
                </div>

                <!-- SWITCH THÈME (CARTOON / FUTURISTE) -->
                <div class="toggle-container">
                    <span class="toggle-label">Thème Cartoon</span>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-label">Thème Cyber</span>
                </div>
            </main>

            <footer class="btn-footer">
                <button id="btn-camera" class="clay-btn btn-primary" onclick="triggerFileSelect()">📷 OUVRIR LA CAMÉRA</button>
            </footer>
            
            <input type="file" id="file-input" accept="image/*">
        </div>

        <!-- ======================================================== -->
        <!-- SCREEN 2: AJUSTEMENT (Photo Plein Écran) -->
        <!-- ======================================================== -->
        <div id="screen-edit" class="screen">
            <header class="page-header">
                <div class="app-title" style="font-family: 'Orbitron', sans-serif; text-transform: uppercase;">Ajuster Photo</div>
            </header>
            
            <div class="photo-frame-container" style="padding: 0;">
                <div class="magic-card-9-16">
                    <canvas id="canvas-preview"></canvas>
                    <div id="touch-layer"></div>
                </div>
            </div>

            <footer class="btn-footer controls-footer">
                <button class="clay-btn btn-secondary" onclick="resetApp()">🔄 REFAIRE PHOTO</button>
                <button class="clay-btn btn-primary" onclick="generateFinal()">✨ VALIDER LA PHOTO</button>
            </footer>
        </div>

        <!-- ======================================================== -->
        <!-- SCREEN 3: RÉSULTAT FINAL (Mode Preview Card) -->
        <!-- ======================================================== -->
        <div id="screen-result" class="screen">
             <header class="page-header">
                <div class="app-title" style="color: var(--cyan-neon);">Carte Collector Prête</div>
            </header>

            <div class="photo-frame-container">
                <div class="magic-card-9-16">
                    <img id="final-image" alt="Diplôme Hangeki">
                </div>
            </div>
            
            <footer class="btn-footer footer-result">
                <a id="download-link" class="clay-btn btn-success" style="text-decoration: none; text-align: center;">💾 ENREGISTRER DANS L'ALBUM</a>
            </footer>
        </div>

    </div>

    <!-- Canvas caché pour le rendu final HD -->
    <canvas id="render-canvas" width="1080" height="1920"></canvas>

    <!-- ======================================================== -->
    <!-- SCRIPT APPLICATION GÉNERIQUE -->
    <!-- ======================================================== -->
    <script>
        /* === CONFIGURATION DE L'APP === */
        const APP_CONFIG = {
            /* Chemins vers vos assets PNG (Ratio 9:16) */
            pngFrames: {
                cartoon: "assets/frame_cartoon.png",
                cyber: "assets/frame_cyber.png"
            },
            
            /* Fontes (Modern UI / Futuriste Cyberpunk) */
            fonts: {
                base: "Inter, sans-serif",
                futuristic: "Orbitron, sans-serif"
            },
            
            /* Affichage automatique des informations */
            toggles: {
                showMonthText: true, 
                showChildName: true  
            },

            /* Mois générés automatiquement selon la date système */
            monthsFr: [
                "Janvier", "Février", "Mars", "Avril", "Mai", "Juin", 
                "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"
            ]
        };

        /* === LOGIQUE FRONDTEND GÉNÉRIQUE === */
        let userImage = new Image();
        let frameImage = new Image();
        let currentTheme = 'cartoon'; 
        let selectedChildName = '';

        let imgScale = 1;
        let imgPosX = 0;
        let imgPosY = 0;
        
        const CANVAS_WIDTH = 1080;
        const CANVAS_HEIGHT = 1920;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function resetApp() {
            document.getElementById('file-input').value = '';
            showScreen('screen-home');
        }

        function triggerFileSelect() {
            // Validation de la saisie manuelle du prénom
            const nameInput = document.getElementById('child-name-input').value.trim();
            if(!nameInput) {
                alert("Veuillez inscrire le prénom ou le surnom de l'enfant 🥊");
                return;
            }
            // Forcer en majuscules pour le style Cyber/Viral
            selectedChildName = nameInput.toUpperCase();

            // Choix du thème
            currentTheme = document.getElementById('theme-toggle').checked ? 'cyber' : 'cartoon';
            frameImage.src = APP_CONFIG.pngFrames[currentTheme];
            
            document.getElementById('file-input').click();
        }

        // --- GESTION PHOTO ---
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    userImage.onload = function() {
                        initEditor();
                    }
                    userImage.src = event.target.result;
                }
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // --- GESTION ÉDITEUR TACTILE ---
        function initEditor() {
            const scaleX = CANVAS_WIDTH / userImage.width;
            const scaleY = CANVAS_HEIGHT / userImage.height;
            imgScale = Math.max(scaleX, scaleY) * 1.1; 
            imgPosX = 0;
            imgPosY = 0;

            showScreen('screen-edit');
            renderPreview();
        }

        const touchLayer = document.getElementById('touch-layer');
        let isDragging = false;
        let startDistance = 0;
        let initialScale = 1;
        let startX = 0, startY = 0;
        let initPosX = 0, initPosY = 0;

        function getDistance(touches) {
            return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        }

        touchLayer.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                initPosX = imgPosX;
                initPosY = imgPosY;
            } else if (e.touches.length === 2) {
                isDragging = false;
                startDistance = getDistance(e.touches);
                initialScale = imgScale;
            }
        }, {passive: false});

        touchLayer.addEventListener('touchmove', function(e) {
            e.preventDefault(); 
            if (e.touches.length === 1 && isDragging) {
                const dx = (e.touches[0].clientX - startX) * 4; 
                const dy = (e.touches[0].clientY - startY) * 4;
                imgPosX = initPosX + dx;
                imgPosY = initPosY + dy;
                renderPreview();
            } else if (e.touches.length === 2) {
                const currentDistance = getDistance(e.touches);
                imgScale = initialScale * (currentDistance / startDistance);
                renderPreview();
            }
        }, {passive: false});

        touchLayer.addEventListener('touchend', function(e) {
            if (e.touches.length < 2) startDistance = 0;
            if (e.touches.length === 0) isDragging = false;
        });

        // ========================================================
        // CANVAS GÉNÉRIQUE & RENDU CYBER VIRAL
        // ========================================================
        function drawScene(ctx, width, height, withText = false) {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(width / 2, height / 2); 
            ctx.translate(imgPosX, imgPosY);
            ctx.scale(imgScale, imgScale);
            
            ctx.filter = 'contrast(1.1) brightness(1.05) saturate(0.95)';
            ctx.drawImage(userImage, -userImage.width / 2, -userImage.height / 2);
            ctx.restore(); 

            if (frameImage.complete && frameImage.naturalHeight !== 0) {
                ctx.drawImage(frameImage, 0, 0, width, height);
            }

            if (withText) {
                const now = new Date();
                const monthText = APP_CONFIG.monthsFr[now.getMonth()] + " " + now.getFullYear();
                
                ctx.save();
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                // 1. Rendu du Prénom (Effet Néon Cyberpunk)
                if(APP_CONFIG.toggles.showChildName) {
                    // Police Italique ultra-grasse
                    ctx.font = `italic 900 120px '${APP_CONFIG.fonts.futuristic}'`;
                    
                    // Passe 1 : Le Halo Néon Cyan
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowColor = "#00d2ff";
                    ctx.shadowBlur = 30;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    wrapTextGen(ctx, selectedChildName, width / 2, height - 280, width - 150, 120);

                    // Passe 2 : Le cœur blanc pur (superposé pour l'éclat)
                    ctx.shadowBlur = 0;
                    wrapTextGen(ctx, selectedChildName, width / 2, height - 280, width - 150, 120);
                }
                
                // 2. Rendu du Mois
                if(APP_CONFIG.toggles.showMonthText) {
                    // Police propre et lisible pour équilibrer
                    ctx.font = `600 50px '${APP_CONFIG.fonts.base}'`;
                    ctx.fillStyle = "#a0aec0"; 
                    ctx.shadowBlur = 0; // Nettoyer l'ombre du prénom
                    wrapTextGen(ctx, monthText.toUpperCase(), width / 2, height - 150, width - 200, 60);
                }

                ctx.restore();
            }
        }

        function wrapTextGen(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let lines = [];
            let line = '';
            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line.trim());
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line.trim());

            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            for(let i = 0; i < lines.length; i++) {
                context.fillText(lines[i], x, startY + (i * lineHeight));
            }
        }

        function renderPreview() {
            const previewCanvas = document.getElementById('canvas-preview');
            previewCanvas.width = CANVAS_WIDTH / 2;
            previewCanvas.height = CANVAS_HEIGHT / 2;
            const ctx = previewCanvas.getContext('2d');
            ctx.scale(0.5, 0.5);
            drawScene(ctx, CANVAS_WIDTH, CANVAS_HEIGHT, false);
        }

        function generateFinal() {
            const renderCanvas = document.getElementById('render-canvas');
            const ctx = renderCanvas.getContext('2d');
            
            drawScene(ctx, CANVAS_WIDTH, CANVAS_HEIGHT, true);
            const dataUrl = renderCanvas.toDataURL('image/jpeg', 0.95);
            
            document.getElementById('final-image').src = dataUrl;
            
            const downloadBtn = document.getElementById('download-link');
            downloadBtn.href = dataUrl;
            downloadBtn.download = `Photo-${currentTheme}-${selectedChildName}.jpg`;
            
            showScreen('screen-result');
        }
    </script>
</body>
</html>
